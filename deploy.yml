---
- name: CI/CD — доставка и развертывание веб-приложения
  hosts: web
  tasks:
    - name: Установить nginx и curl
      apt:
        name:
          - nginx
          - curl
        state: present
        update_cache: yes

    - name: Скопировать собранную страницу
      copy:
        src: index.html
        dest: /var/www/html/index.html

    - name: Запустить nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Проверить, что сайт отвечает
      command: curl -sf http://127.0.0.1
      register: site
      changed_when: false

    - name: Показать ответ сайта
      debug:
        msg: "{{ site.stdout }}"
