---
- name: Поднять Flask todo-app в Docker на master
  hosts: master
  connection: local
  gather_facts: false
  vars:
    app_image: "{{ image | default('todo-app:latest') }}"
    app_container: "{{ container_name | default('todo-app') }}"
  tasks:
    - name: Остановить старый контейнер
      shell: sudo docker rm -f {{ app_container }}
      register: rm
      changed_when: "'No such container' not in (rm.stderr | default(''))"
      failed_when: false

    - name: Запустить контейнер на сети ansible-net
      shell: >
        sudo docker run -d
        --name {{ app_container }}
        --network ansible-net
        -p 5000:5000
        -v todo_data:/data
        --restart unless-stopped
        {{ app_image }}
      register: run

    - name: Показать id контейнера
      debug:
        msg: "{{ run.stdout }}"

    - name: Дождаться готовности /health
      uri:
        url: "http://{{ app_container }}:5000/health"
        return_content: yes
      register: health
      until: health.status == 200
      retries: 10
      delay: 1

    - name: Показать health
      debug:
        msg: "{{ health.json | default(health.content) }}"
